# v で始まるタグ（v0.2.0 など）を push すると、テストしてから Windows 用のインストーラーを作り、
# GitHub の Releases に公開する。アプリのバージョンはタグから取る
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # WSL 用エージェントは Linux 向け（musl）に、Windows 上で rust-lld でビルドしてアプリに埋め込む
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/core
            crates/agent

      - name: タグからバージョンを設定する
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          # MSI は「数字.数字.数字」しか受け付けない
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "タグ ${{ github.ref_name }} は v1.2.3 の形にしてください" }
          $path = 'src-tauri/tauri.conf.json'
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8NoBOM

      - run: npm ci

      - name: テスト
        run: |
          npm run check
          npm test
          cd crates/core
          cargo test
          cd ../../src-tauri
          cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # アップデートの署名鍵（npx tauri signer generate で作ったもの。パスワードなし）。
          # これで署名した更新ファイルと latest.json がリリースに添付され、アプリが自動アップデートに使う
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mark-shell ${{ github.ref_name }}
          releaseBody: |
            下の Assets から選んでください。
            - `*-setup.exe`: インストーラー（通常はこちら）
            - `*.msi`: 管理者が配布するときのインストーラー
            - `*-portable.exe`: インストールせずにそのまま起動できる単体の exe（WebView2 ランタイムが必要。Windows 11 は標準で入っている）
          releaseDraft: false
          prerelease: false

      # インストールせずに使える単体の exe も置く（画面の部品は exe に埋め込まれている。WebView2 ランタイムは必要）
      - name: 単体実行版の exe を添付する
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $portable = "mark-shell_${version}_x64-portable.exe"
          Copy-Item src-tauri/target/release/mark-shell.exe $portable
          gh release upload '${{ github.ref_name }}' $portable --clobber
