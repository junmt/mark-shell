# v で始まるタグ（v0.2.0 など）を push すると、テストしてから Windows 用・Mac 用のインストーラーを作り、
# GitHub の Releases に公開する。アプリのバージョンはタグから取る
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: タグを確認してリリース枠を作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "タグ $TAG は v1.2.3 の形にしてください" >&2
            exit 1
          fi
          body="$(cat <<'EOF'
          下の Assets からお使いの OS に合うものを選んでください。
          - **Windows**
            - `*-setup.exe`: インストーラー（通常はこちら）
            - `*.msi`: 管理者が配布するときのインストーラー
            - `*-portable.exe`: インストールせずにそのまま起動できる単体の exe（WebView2 ランタイムが必要。Windows 11 は標準で入っている）
          - **Mac**
            - `*_universal.dmg`: インストーラー（Apple Silicon / Intel 両対応。開いて `mark-shell.app` を `Applications` に入れてください。初回起動時に警告が出た場合は、右クリック →「開く」または「システム設定」→「プライバシーとセキュリティ」から許可してください）
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "mark-shell $TAG" --notes "$body"
          else
            gh release create "$TAG" --title "mark-shell $TAG" --notes "$body"
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # WSL 用エージェントは Linux 向け（musl）に、Windows 上で rust-lld でビルドしてアプリに埋め込む
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/core
            crates/agent

      - name: タグからバージョンを設定する
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $path = 'src-tauri/tauri.conf.json'
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8NoBOM

      - run: npm ci

      - name: テスト
        run: |
          npm run check
          npm test
          cd crates/core
          cargo test
          cd ../../src-tauri
          cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # アップデートの署名鍵（npx tauri signer generate で作ったもの。パスワードなし）。
          # これで署名した更新ファイルと latest.json がリリースに添付され、アプリが自動アップデートに使う
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mark-shell ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false

      # インストールせずに使える単体の exe も置く（画面の部品は exe に埋め込まれている。WebView2 ランタイムは必要）
      - name: 単体実行版の exe を添付する
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $portable = "mark-shell_${version}_x64-portable.exe"
          Copy-Item src-tauri/target/release/mark-shell.exe $portable
          gh release upload '${{ github.ref_name }}' $portable --clobber

  macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Apple Silicon と Intel の両方で動く Universal バイナリを作る
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/core

      - name: タグからバージョンを設定する
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.TAG.replace(/^v/, "");
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '
        env:
          TAG: ${{ github.ref_name }}

      - run: npm ci

      - name: テスト
        run: |
          npm run check
          npm test
          cd crates/core
          cargo test
          cd ../../src-tauri
          cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: mark-shell ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
