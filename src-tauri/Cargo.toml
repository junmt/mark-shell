[package]
name = "mark-shell"
version = "0.1.0"
description = "Markdown メモとシェルで AI を使える Windows アプリ"
edition = "2021"

[lib]
name = "mark_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
notify = "8"
portable-pty = "0.9"
trash = "5"
encoding_rs = "0.8"
chardetng = "0.1"
which = "7"
dirs = "6"
base64 = "0.22"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
