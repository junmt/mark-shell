[package]
name = "mark-shell"
version = "0.1.12"
description = "Markdown メモとシェルで AI を使える Windows アプリ"
edition = "2021"

[lib]
name = "mark_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markshell-core = { path = "../crates/core" }
regex = "1"
portable-pty = "0.9"
trash = "5"
which = "7"
dirs = "6"
base64 = "0.22"
percent-encoding = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
