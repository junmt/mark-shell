[package]
name = "mark-shell"
version = "0.3.4"
description = "Markdown メモとシェルで AI を使えるデスクトップアプリ"
edition = "2021"

[lib]
name = "mark_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
markshell-core = { path = "../crates/core" }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.9"
trash = "5"
which = "7"
dirs = "6"
base64 = "0.22"
percent-encoding = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Windows 固有の依存（レジストリ・DWM・プロセス判定・WebView2 の設定）。版は wry が使うものに合わせる
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
