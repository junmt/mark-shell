[package]
name = "mark-shell-agent"
version = "0.1.0"
description = "WSL の中で動き、mark-shell の代わりにファイルの探索・検索・監視・リンクの書き換えを行う"
edition = "2021"
publish = false

[dependencies]
markshell-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
