[package]
name = "markshell-core"
version = "0.1.0"
description = "mark-shell の Windows 版と WSL 用エージェントで共有する処理（探索・検索・監視・リンクの書き換え・文字コード）"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
encoding_rs = "0.8"
chardetng = "0.1"
percent-encoding = "2"
base64 = "0.22"

# Linux（WSL のエージェント）では inotify を直接使う（watch_inotify.rs）
[target.'cfg(not(target_os = "linux"))'.dependencies]
notify = "8"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false }
